name: iOS TestFlight

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'ios/**'
      - 'pubspec.*'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUNDLE_ID: br.com.consart.coletor
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      RAW_APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      RAW_CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - run: flutter pub get

      # Signing and upload need the four App Store Connect secrets.
      # Without them (or on a pull request) the app is only compiled, unsigned.
      - name: Check secrets
        id: secrets
        run: |
          if [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] && [ -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] \
             && [ -n "$RAW_APP_STORE_CONNECT_PRIVATE_KEY" ] && [ -n "$RAW_CERTIFICATE_PRIVATE_KEY" ] \
             && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Sem os secrets da App Store Connect (ou em PR): só compilando, sem assinar nem enviar."
            echo "sign=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (unsigned)
        if: steps.secrets.outputs.sign != 'true'
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Install Codemagic CLI tools
        if: steps.secrets.outputs.sign == 'true'
        run: pipx install codemagic-cli-tools

      # Keys pasted from Windows can carry CRLF line endings, blank lines or
      # lose the BEGIN/END lines; rebuild a clean PEM before using them.
      - name: Normalize keys
        if: steps.secrets.outputs.sign == 'true'
        run: |
          normalize() {
            clean="$(printf '%s' "$1" | tr -d '\r')"
            if printf '%s' "$clean" | grep -q ENCRYPTED; then
              echo "::error::A chave $2 está protegida por senha; gere de novo sem senha." >&2; exit 1
            fi
            header="$(printf '%s' "$clean" | grep -o -m1 -E -- '-----BEGIN [A-Z ]+-----' || true)"
            [ -n "$header" ] || header="-----BEGIN $2-----"
            body="$(printf '%s' "$clean" | sed -E 's/-----(BEGIN|END) [A-Z ]+-----//g' | tr -d ' \n\t')"
            printf '%s\n' "$header"; printf '%s' "$body" | fold -w 64; printf '\n%s\n' "${header/BEGIN/END}"
          }
          {
            echo "APP_STORE_CONNECT_PRIVATE_KEY<<EOF_KEY"
            normalize "$RAW_APP_STORE_CONNECT_PRIVATE_KEY" "PRIVATE KEY"
            echo "EOF_KEY"
            echo "CERTIFICATE_PRIVATE_KEY<<EOF_KEY"
            normalize "$RAW_CERTIFICATE_PRIVATE_KEY" "RSA PRIVATE KEY"
            echo "EOF_KEY"
          } >> "$GITHUB_ENV"

      - name: Sign and build IPA
        if: steps.secrets.outputs.sign == 'true'
        run: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
          flutter build ipa --release --build-number=${{ github.run_number }} \
            --export-options-plist="$HOME/export_options.plist"

      - name: Upload to TestFlight
        if: steps.secrets.outputs.sign == 'true'
        run: app-store-connect publish --path "$(ls build/ios/ipa/*.ipa | head -1)"

      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.sign == 'true'
        with:
          name: ipa
          path: build/ios/ipa/*.ipa

      - name: Clean up keychain
        if: always() && steps.secrets.outputs.sign == 'true'
        run: keychain use-login
